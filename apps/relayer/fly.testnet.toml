# Deploy with -a <relayer-app-testnet> --ha=false. One machine keeps the
# relayer's in-memory budgets and rate limits together.
primary_region = "fra"

[env]
  NETWORK = "testnet"
  NEAR_RPC_URL = "https://rpc.testnet.near.org"
  FAIRGROUND_CONTRACT = "sealround.itzbeast.testnet"
  USDC_CONTRACTS = "usdc.fakes.testnet,3e2210e1184b45b64c8a434c0a7e7b23cc04ea7eb7a6c3c32520d03d4afcb8af"
  CLIENT_IP_HEADER = "fly-client-ip"
  TRUSTED_PROXY_HOPS = "1"
  DAILY_BUDGET_NEAR = "5"
  STORAGE_BUDGET_NEAR = "0.5"
  PORT = "8787"

# Set RELAYER_ACCOUNT_ID, RELAYER_PRIVATE_KEY, and CORS_ORIGINS on Fly.
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # /policy answers without RPC. /health checks funding and RPC separately.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/policy"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
