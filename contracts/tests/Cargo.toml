[package]
name = "fairground-integration"
description = "Fairground sandbox integration tests: real contracts, OutLayer's own wasm, the test as the OutLayer worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

# A workspace of its own (the root workspace excludes this directory), with its
# own Cargo.lock and target dir: near-workspaces and its dependency tree never
# enter the contracts' builds.
[workspace]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
# Seals an old-format (unpadded) bid, which the contract must refuse for its length.
crypto_box = { version = "0.9.1", default-features = false, features = ["alloc", "getrandom", "salsa20", "seal"] }
fairground-clearing = { path = "../../crates/clearing" }
fairground-sealer = { path = "../../crates/sealer", features = ["seal"] }
futures = "0.3.34"
near-workspaces = { version = "0.24.0", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

# The test plays the OutLayer worker and opens up to 500 sealed boxes per
# sale; unoptimised curve arithmetic would make that take minutes.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.ethnum]
opt-level = 3
